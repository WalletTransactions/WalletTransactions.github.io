schema: spec-driven

context: |
  Все артефакты OpenSpec пишутся на русском.
  wallet-site — публичный сайт продукта «Посчитай и сбереги» (Count & Save):
  описание, бизнес-сервисы, возможности, состав, планы. Собирается MkDocs Material
  (mkdocs-material 9.5.39) с плагином mkdocs-static-i18n 1.2.3 и публикуется в
  GitHub Pages workflow-ом .github/workflows/pages.yml. Это документация-статика:
  своего сервера, API и базы нет, на стеке WalletTransactions не запускается.
  Языки: ru (по умолчанию, адрес /) и en (/en/); одна папка docs/<язык>/ на язык,
  имена файлов во всех папках одинаковые. Меню (nav) одно на все языки, пишется
  по-русски, заголовки переводятся в nav_translations. Якоря задаются явно и
  латиницей ({ #statement-import }). Сначала правится русская страница, потом переводы.
  Страница описывает возможности продукта на уровне пользователя, без внутренних
  деталей реализации; источник правды о поведении — OpenSpec сервисов (wallet-web,
  android-wallet, wallet-telegram, wallet-ai, wallet-mcp и др.), здесь они не дублируются.
  Автотестов нет: проверка — mkdocs build --strict и tools/check_translations.py.

rules:
  specs:
    - Каждое требование — с хотя бы одним сценарием WHEN/THEN
    - Тексты страниц, на которые опираются сценарии, приводить дословно
    - Не копировать в спеки контент страниц целиком — фиксировать структуру и обязательные утверждения
  design:
    - Указывать, какие сервисы продукта затрагивает описание, и нужна ли правка их OpenSpec
  tasks:
    - Каждая задача заканчивается `mkdocs build --strict` и `python tools/check_translations.py`
    - Правка страницы — сначала docs/ru/, затем docs/en/ с тем же именем файла
